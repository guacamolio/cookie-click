<!DOCTYPE html>
<html lang="lv">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <!-- Decorative coins are placed here so they can fall behind the game UI. -->
    <div id="falling-coins" aria-hidden="true"></div>
    <main class="game-area">
        <!-- Main click area: the score is positioned above the coin with CSS. -->
        <section class="clicker-area" aria-label="Cookie clicker">
            <button class="coin" aria-label="Play"></button>
            <span id="punktuskaits">0</span>
        </section>

        <aside class="upgrades-panel" aria-label="Upgrades">
            <h1>UPGRADES</h1>
            <!-- This status line shows the current passive income and click bonuses. -->
            <p id="game-status" aria-live="polite"></p>
            <!-- Selecting an amount changes how many repeatable levels one purchase buys. -->
            <div class="purchase-options" aria-label="Purchase amount">
                <button class="purchase-option active" data-amount="1">1x</button>
                <button class="purchase-option" data-amount="10">10x</button>
                <button class="purchase-option" data-amount="100">100x</button>
                <button class="purchase-option" data-amount="max">MAX</button>
            </div>
            <!-- JavaScript fills each button with its current level, cost, and state. -->
            <div class="upgrade-list">
                <button class="upgrade-slot" data-upgrade="piggy"></button>
                <button class="upgrade-slot" data-upgrade="copper"></button>
                <button class="upgrade-slot" data-upgrade="minting"></button>
                <button class="upgrade-slot" data-upgrade="golden"></button>
                <button class="upgrade-slot" data-upgrade="mint"></button>
                <button class="upgrade-slot" data-upgrade="detectorists"></button>
                <button class="upgrade-slot" data-upgrade="diver"></button>
                <button class="upgrade-slot" data-upgrade="reserve"></button>
                <button class="upgrade-slot" data-upgrade="lucky"></button>
                <button class="upgrade-slot" data-upgrade="magnet"></button>
                <button class="upgrade-slot" data-upgrade="interest"></button>
                <button class="upgrade-slot" data-upgrade="alchemist"></button>
                <button class="upgrade-slot" data-upgrade="timeWarp"></button>
            </div>
        </aside>
        <!-- This separate bonus coin is revealed on a random timer. -->
        <button id="bonus-coin" aria-label="Collect bonus coin" hidden></button>
    </main>
</body>
</html>
